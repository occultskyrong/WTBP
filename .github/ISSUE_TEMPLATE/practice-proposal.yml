name: 实践提案
description: 提出新增、更新、废弃或替代一项最佳实践的建议。
title: "[实践] "
body:
  - type: markdown
    attributes:
      value: "请描述决策场景，而不仅是偏好的方案。"
  - type: dropdown
    id: change_type
    attributes:
      label: 变更类型
      options:
        - 新增实践
        - 更新现有实践
        - 废弃或替代实践
    validations:
      required: true
  - type: input
    id: practice_id
    attributes:
      label: 建议的 Practice ID
      placeholder: database.schema-design
  - type: textarea
    id: problem_and_context
    attributes:
      label: 问题与适用场景
      description: 请在适用时说明规模、约束、现有技术栈、安全或合规、成本和可逆性。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 候选方案与取舍
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与参考实现
      description: 请提供官方文档、基准测试、事故复盘或可运行示例，并注明版本或访问日期。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 建议的验证方法
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 贡献检查清单
      options:
        - label: 我已说明该建议不应使用的条件。
          required: true
        - label: 我已确认现有 Practice 是否已经覆盖该决策。
          required: true
