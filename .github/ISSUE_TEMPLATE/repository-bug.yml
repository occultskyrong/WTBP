name: 仓库问题
description: 报告 WTBP 工具、校验、Hook、CI 或模板的问题。
title: "[仓库] "
body:
  - type: dropdown
    id: component
    attributes:
      label: 组件
      options:
        - 仓库校验
        - 提交 Hook
        - GitHub Actions
        - Skill 打包
        - Registry 或模式
        - Issue 或 PR 模板
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与相关日志
    validations:
      required: true
