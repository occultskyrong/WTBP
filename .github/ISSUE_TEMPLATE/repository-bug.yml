name: Repository bug
description: Report a problem with WTBP tooling, validation, hooks, CI, or templates.
title: "[repo] "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Repository validation
        - Commit hook
        - GitHub Actions
        - Skill packaging
        - Registry or schema
        - Issue or pull request template
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
