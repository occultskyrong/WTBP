name: WTBP 仓库检查

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: 仓库验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 安装校验运行环境
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: 安装 Skill 评测 Runner
        run: |
          mkdir -p "$RUNNER_TEMP/wtbp-skill-up-bin"
          curl -fsSL https://raw.githubusercontent.com/alibaba/skill-up/main/install.sh \
            | INSTALL_DIR="$RUNNER_TEMP/wtbp-skill-up-bin" bash
          echo "$RUNNER_TEMP/wtbp-skill-up-bin" >> "$GITHUB_PATH"
      - name: 执行提交清单
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && git rev-parse --verify "${HEAD_SHA}^2" >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^2")"
          fi
          make commit-checklist-range BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA"

  publish-version-tag:
    name: 发布版本 Tag
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 在版本变化后发布不可变 Tag
        run: ./tooling/publish-version-tag.sh "$GITHUB_SHA"
