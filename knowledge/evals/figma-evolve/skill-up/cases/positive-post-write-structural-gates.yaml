input:
  prompt: "修改这个 Figma 文件中的多个小程序产品页面并保留原版本。若存在消费项目，先根据仓库和运行证据建立或刷新 PDC-YYYYMMDD-VNN，完成 PDC-01 至 PDC-06 和冲突确认，并形成 ARC-YYYYMMDD-VNN 后再决定架构或结构变更。新增、结构变化或动作组/Icon 变化时，必须先创建或刷新并审批 INV-YYYYMMDD-VNN，再为每个受影响页面/状态创建或刷新 PS-YYYYMMDD-VNN：先写页面说明、完整盘点元素层级、明确公共组件/Token/Icon/资产复用，再写 L0 至 L3 分层计划和设计到代码映射。之后建立或刷新 AGC-YYYYMMDD-VNN，通过 AGC-01 至 AGC-06，之后建立或刷新 ICON-YYYYMMDD-VNN，通过 IA-01 至 IA-07，并把缺失 Icon 独立设计为同一家族组件。然后构造所有页面/状态的中性底层窗体并通过 BF-01 至 BF-06。评审发现节点迁移、页面增删或 Section 列数变化时，必须按实际内容边界加固定内边距重算每个受影响 Section，不得沿用旧固定宽高。再在可见边界完整包围页面的小程序外框中检查所有页面的 layoutMode、TabBar 等权分布、独立右侧 annotation、文字和嵌套组件递归边界、共享组件实例与 master 的尺寸比例，并确认产品页面没有设计说明；不得用通用手机框或裸画布代替小程序外框。"

expect:
  must_contain:
    - "DCS-YYYYMMDD-VNN"
    - "wtbp"
    - "BF-01"
    - "BF-02"
    - "BF-03"
    - "BF-04"
    - "BF-05"
    - "BF-06"
    - "PDC-01"
    - "PDC-02"
    - "PDC-03"
    - "PDC-04"
    - "PDC-05"
    - "PDC-06"
    - "ARC-YYYYMMDD-VNN"
    - "PS-YYYYMMDD-VNN"
    - "PS-01"
    - "PS-02"
    - "PS-03"
    - "PS-04"
    - "PS-05"
    - "INV-YYYYMMDD-VNN"
    - "AGC-YYYYMMDD-VNN"
    - "AGC-01"
    - "AGC-02"
    - "AGC-03"
    - "AGC-04"
    - "AGC-05"
    - "AGC-06"
    - "ICON-YYYYMMDD-VNN"
    - "IA-01"
    - "IA-02"
    - "IA-03"
    - "IA-04"
    - "IA-05"
    - "IA-06"
    - "IA-07"
    - "分布"
    - "递归"
    - "G-01"
    - "G-02"
    - "G-03"
    - "G-04"
    - "G-05"
    - "G-06"
    - "所有页面"
    - "小程序外框"
    - "可见边界"
    - "Section"
    - "固定内边距"
  must_not_contain:
    - "自动安装第三方"
    - "只验收修改过的页面"
