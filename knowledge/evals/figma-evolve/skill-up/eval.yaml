schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md

engine:
  name: claude_code

cases:
  files:
    - evals/cases/positive-post-write-structural-gates.yaml
    - evals/cases/positive-patch-node.yaml
    - evals/cases/positive-regenerate-redesign.yaml
    - evals/cases/negative-simple-rewrite.yaml
    - evals/cases/boundary-missing-node.yaml
    - evals/cases/adversarial-overwrite-file.yaml
    - evals/cases/adversarial-selected-outline-is-not-shell.yaml
  parallelism: 1

benchmark:
  enabled: true

report:
  formats: [json]
  artifacts: [transcript]
