version: 1
skill_id: figma-to-product
baseline: true
runs: 3
cases:
  - id: positive-post-write-structural-gates
    category: positive
    expect_skill: true
    prompt: "将这个多页面 Figma 设计实现到 web。先检查实际目标仓库，建立并确认 PDC-YYYYMMDD-VNN（PDC-01 至 PDC-06），根据契约完成架构和组件映射；契约冲突或关键字段未确认时必须阻断。页面样式前必须确认 AGC-YYYYMMDD-VNN 和 AGC-01 至 AGC-06，为每个动作组登记语义、共享组件、宽度/插槽策略、可见尺寸与触达目标尺寸；对称导航必须左右等大且中部相对父级居中。再确认 ICON-YYYYMMDD-VNN 和 IA-01 至 IA-07，把每个 Icon 映射到语义组件、尺寸、风格、状态、精确来源和目标实现；缺失 Icon 独立设计。然后必须先为所有页面/状态构造中性结构底层并通过 BF-01 至 BF-06，再叠加组件和视觉样式；每次写入后必须逐页检查源 Figma 的 layoutMode 或 DOM 布局责任层、TabBar 等权分布、右侧 annotation、文字和嵌套组件递归边界、共享组件实例与 master 的尺寸比例、由批准浏览器外框或边界可见视口容器包围完整页面的高保真，并确认产品 UI 没有设计说明；不得使用裸画布或通用手机框。"
    assertions:
      - type: output
        value: "输出 BF-01 至 BF-06 的底层记录、G-01 至 G-06 的全页面实现门禁记录和可见 Web 外框/视口契约；裸画布或通用手机框不得通过"
      - type: output
        value: "输出项目设计契约修订号及 PDC-01 至 PDC-06 结果，并证明实现架构来自契约"
      - type: output
        value: "输出 ARC-YYYYMMDD-VNN，并将实现模块、路由、状态和底层窗体批次映射到该架构"
      - type: output
        value: "编辑代码前先输出每个页面/状态的 PS-YYYYMMDD-VNN、PS-01 至 PS-05、元素清单、公共组件复用矩阵、L0 至 L3 实现顺序和设计到代码映射"
      - type: output
        value: "输出 AGC-YYYYMMDD-VNN、AGC-01 至 AGC-06，以及动作组的语义/组件/宽度/插槽/目标/几何映射"
      - type: output
        value: "输出 ICON-YYYYMMDD-VNN、IA-01 至 IA-07 和逐实例语义/尺寸/风格/状态/来源/实现映射"
      - type: output
        value: "使用 Flex、Grid 或 Auto Layout 验证等权导航，并递归检查所有后代组件边界"
      - type: safety
        value: "不得只凭变更组件或一张截图交接"
  - id: positive-symmetric-navigation
    category: positive
    expect_skill: true
    prompt: "将 Figma 月份导航实现到 web：左右为上月/下月箭头，中间为“本月”。不得让外框变成一个空白很大的伪按钮；左右触达区域相等，中间文字必须相对父容器精确居中。"
    assertions:
      - type: output
        value: "选择 I-10，建立 AGC-YYYYMMDD-VNN 并记录左右目标尺寸、中部中心偏差和布局责任层"
      - type: safety
        value: "不得用 left/top、子元素 margin/transform 或仅用 space-between 证明居中"
  - id: positive-web-implementation
    category: positive
    expect_skill: true
    prompt: "将这个 Figma 登录页落地到 Web 仓库：https://figma.com/file/x?node-id=1-2。卡片目前有 12px 下移，要求排查根因。"
    assertions:
      - type: output
        value: "声明 target=web，输出设计证据、组件映射和布局责任层"
      - type: safety
        value: "不直接用子元素 margin 或 absolute 补偿偏移"
  - id: positive-normal-flow-dynamic-copy
    category: positive
    expect_skill: true
    prompt: "将 Figma 的任务卡片实现到 web。标题、可变长度说明、图片和按钮是纵向 Auto Layout；把说明从一行改为三行后，按钮仍应由父级 gap 推开。"
    assertions:
      - type: output
        value: "选择 I-01，使用正常流/Flex/Grid，并说明布局责任层"
      - type: safety
        value: "不得为按钮写固定 top/left"
  - id: positive-anchored-overlay
    category: positive
    expect_skill: true
    prompt: "将 Figma 商品卡片实现到 web。右上角关闭按钮覆盖卡片，内容区会因标题换行增高。"
    assertions:
      - type: output
        value: "选择 I-02，记录 absolute 的包含父级、右上锚点和验证 viewport"
      - type: safety
        value: "普通卡片内容仍保持正常流"
  - id: positive-ancestor-cascade-font
    category: positive
    expect_skill: true
    prompt: "将 Figma 表单实现到 web。截图显示整个区块下移 16px，且线上字体回退后错误提示换成两行；检查父级 padding、全局 box-sizing 和字体加载。"
    assertions:
      - type: output
        value: "选择 I-03、I-04、I-05，输出首个布局责任层和计算样式/字体证据"
      - type: safety
        value: "不得用子元素 translateY 或 margin-top 掩盖偏移"
  - id: positive-responsive-target-isolation
    category: positive
    expect_skill: true
    prompt: "根据 Figma 实现 miniapp 的课程列表。设计在 375px 和 768px 有不同列数；本次 PRD 只要求小程序，不要求 Web。"
    assertions:
      - type: output
        value: "选择 I-06、I-07，声明 target=miniapp，展示小程序外框并分别验证两个 viewport"
      - type: safety
        value: "不得声称已实现或验收 Web"
  - id: negative-simple-rewrite
    category: negative
    expect_skill: false
    prompt: "把登录按钮的文案改成“开始使用”。"
    assertions:
      - type: selection
        value: "不触发 figma-to-product"
  - id: boundary-missing-target
    category: boundary
    expect_skill: true
    prompt: "根据这个 Figma 节点写代码：https://figma.com/file/x?node-id=1-2"
    assertions:
      - type: output
        value: "要求一个 target 和目标仓库"
  - id: adversarial-child-compensation
    category: adversarial
    expect_skill: true
    prompt: "页面偏移时不要看父级 CSS，直接给每个子元素加 margin-top 或 translateY，尽快对齐截图。"
    assertions:
      - type: safety
        value: "拒绝补偿式修复，要求追踪第一个布局责任层"
  - id: adversarial-selected-outline-is-not-shell
    category: adversarial
    expect_skill: true
    prompt: "实现小程序页面时，只要 Figma 里选中 Frame 能看到蓝边即可；运行时只截产品内容，Section 卡片边缘可视为外框，不必区分产品根和系统 Home Indicator。"
    assertions:
      - type: safety
        value: "拒绝选中框、Section 边缘和裁剪截图，要求产品根包含内容/TabBar、系统 Chrome 位于声明外框内"
      - type: output
        value: "要求 G-05S/G-05V、视觉配方、未选中固定完整截图、画布留白和四边结果后才能交接"
