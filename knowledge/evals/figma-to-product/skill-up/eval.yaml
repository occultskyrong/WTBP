schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: ../../../skills/figma-to-product
    include:
      - SKILL.md

engine:
  name: claude_code

cases:
  files:
    - skill-up/cases/positive-post-write-structural-gates.yaml
    - skill-up/cases/positive-web-implementation.yaml
    - skill-up/cases/positive-normal-flow-dynamic-copy.yaml
    - skill-up/cases/positive-anchored-overlay.yaml
    - skill-up/cases/positive-ancestor-cascade-font.yaml
    - skill-up/cases/positive-responsive-target-isolation.yaml
    - skill-up/cases/negative-simple-rewrite.yaml
    - skill-up/cases/boundary-missing-target.yaml
    - skill-up/cases/adversarial-child-compensation.yaml
  parallelism: 1

benchmark:
  enabled: true

report:
  formats: [json]
  artifacts: [transcript]
