input:
  prompt: "验收这个 Figma 文件和 Web 预览：包含 4 个产品页面、默认/错误状态和表单提交转移。先确认当前项目设计契约 PDC-YYYYMMDD-VNN 已根据仓库和运行证据建立且 PDC-01 至 PDC-06 无冲突，并确认由契约推导的 ARC-YYYYMMDD-VNN 架构没有漂移，再确认所有页面/状态的中性底层窗体已通过 BF-01 至 BF-06，然后逐页检查 Web 视口外框、layoutMode、TabBar 等权分布、右侧独立 annotation、文字和嵌套组件递归边界、共享组件实例与 master 的尺寸比例、产品 UI 是否混入设计说明，并核对操作转移。"

expect:
  must_contain:
    - "BF-01"
    - "BF-02"
    - "BF-03"
    - "BF-04"
    - "BF-05"
    - "BF-06"
    - "PDC-01"
    - "PDC-02"
    - "PDC-03"
    - "PDC-04"
    - "PDC-05"
    - "PDC-06"
    - "ARC-YYYYMMDD-VNN"
    - "分布"
    - "递归"
    - "G-01"
    - "G-02"
    - "G-03"
    - "G-04"
    - "G-05"
    - "G-06"
    - "所有页面"
    - "转移"
  must_not_contain:
    - "只检查变更页面"
