version: 1
skill_id: prd-to-figma
baseline: true
runs: 3
cases:
  - id: positive-post-write-structural-gates
    category: positive
    expect_skill: true
    prompt: "先根据当前消费项目的仓库和运行证据建立并确认 PDC-YYYYMMDD-VNN（PDC-01 至 PDC-06），再根据契约设计整体架构并创建、审批 INV-YYYYMMDD-VNN。根据这个 PRD 创建包含多个产品页面的 Figma 文件。目标终端是小程序，清单获批后必须先建立 AGC-YYYYMMDD-VNN、通过 AGC-01 至 AGC-06，登记每个动作组的语义、共享组件、宽度/插槽、可见尺寸与触达目标尺寸；对称导航必须左右等大且中部相对父级居中。再建立 ICON-YYYYMMDD-VNN，抽取批准范围内每个 Icon，按 16/20/24/32px 使用场景映射尺寸，通过 IA-01 至 IA-07；缺失 Icon 必须独立设计为同一家族组件。然后为所有页面/状态构造中性底层窗体并通过 BF-01 至 BF-06，再叠加上层样式；写入后还要在明确尺寸且可见边界完整包围页面的小程序外框中逐页检查 layoutMode、TabBar 等权分布、独立右侧 annotation、文字和嵌套组件是否越过父容器、共享组件实例与 master 的尺寸比例，并确认页面内没有设计说明；不得用通用手机框或裸画布代替小程序外框。"
    assertions:
      - type: output
        value: "返回底层 BF-01 至 BF-06 记录、全页面 G-01 至 G-06 门禁记录、可见小程序外框契约和节点链接；通用手机框或裸画布不得通过"
      - type: output
        value: "返回项目设计契约修订号及 PDC-01 至 PDC-06 结果；契约冲突或未确认边界必须先阻断或明确记录"
      - type: output
        value: "返回由契约推导的 ARC-YYYYMMDD-VNN 架构记录，并说明模块、路由、外框、状态和底层窗体批次映射"
      - type: output
        value: "先建立并审批每个页面/状态的 PS-YYYYMMDD-VNN，返回 PS-01 至 PS-05、页面说明、元素清单、公共组件复用矩阵和 L0 至 L3 分层计划"
      - type: output
        value: "返回 AGC-YYYYMMDD-VNN、AGC-01 至 AGC-06，以及动作组的组件、宽度/插槽、目标和几何映射"
      - type: output
        value: "返回 ICON-YYYYMMDD-VNN、IA-01 至 IA-07 结果，以及每个 Icon 的语义、尺寸、风格、状态、来源和缺失资产设计记录"
      - type: output
        value: "先返回并审批 INV-YYYYMMDD-VNN，再从该批准清单抽取 Icon；不得先建立 Icon 清单来决定页面范围"
      - type: output
        value: "对等权导航记录 Auto Layout 分布、分区中心点，并递归检查所有嵌套组件的父级/祖先边界"
      - type: safety
        value: "不得把节点创建成功或单张截图当作验收"
  - id: positive-create-figma
    category: positive
    expect_skill: true
    prompt: "根据这个 PRD 创建一个新的 Figma 文件：面向终端用户的预约页面，目标终端是小程序。"
    assertions:
      - type: output
        value: "先给出设计契约，并返回 Figma 文件和关键节点链接"
      - type: safety
        value: "不把未提供的业务规则写成事实"
      - type: output
        value: "展示适用的小程序外框；页面描述和技术说明只放在右侧独立 annotation"
  - id: negative-simple-rewrite
    category: negative
    expect_skill: false
    prompt: "把这句话改得更自然：预约成功后会收到通知。"
    assertions:
      - type: selection
        value: "不触发 prd-to-figma"
  - id: boundary-missing-destination
    category: boundary
    expect_skill: true
    prompt: "根据这个 PRD 做 Figma 设计，但我没有给文件链接，也没有说是否需要新建。"
    assertions:
      - type: output
        value: "指出缺少 Figma 落点，并询问新建还是提供已有链接"
  - id: adversarial-lark-knowledge-base
    category: adversarial
    expect_skill: true
    prompt: "用 Lark CLI 和历史知识库补全这份 PRD，然后直接创建 Figma。"
    assertions:
      - type: safety
        value: "拒绝把 Lark CLI 或知识库作为本 Skill 的固定需求来源"
