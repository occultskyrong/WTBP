input:
  prompt: "先根据当前消费项目的仓库和运行证据建立并确认 PDC-YYYYMMDD-VNN（PDC-01 至 PDC-06），形成由契约推导的 ARC-YYYYMMDD-VNN 整体架构，再创建并审批 INV-YYYYMMDD-VNN。根据这个 PRD 创建包含多个小程序产品页面的 Figma 文件。清单获批后，先为每个页面/状态建立 PS-YYYYMMDD-VNN：写清页面说明和边界，完整盘点元素层级，映射可复用组件/Token/Icon/资产，并明确 L0 至 L3 分层顺序和设计到代码映射。再建立 AGC-YYYYMMDD-VNN，通过 AGC-01 至 AGC-06，为每个动作组登记语义、共享组件、宽度/插槽、可见尺寸与触达目标尺寸；对称导航必须左右等大且中部相对父级居中。再建立 ICON-YYYYMMDD-VNN，抽取批准范围内每个 Icon，按 16/20/24/32px 使用场景映射尺寸，通过 IA-01 至 IA-07；缺失 Icon 必须独立设计为同一家族组件。然后构造所有页面/状态的中性底层窗体并通过 BF-01 至 BF-06，再在可见边界完整包围页面的小程序外框中逐页检查 layoutMode、TabBar 等权分布、独立右侧 annotation、文字和嵌套组件递归边界、共享组件实例与 master 的尺寸比例，并确认页面内没有设计说明；不得用通用手机框或裸画布代替小程序外框。"

expect:
  must_contain:
    - "BF-01"
    - "BF-02"
    - "BF-03"
    - "BF-04"
    - "BF-05"
    - "BF-06"
    - "PDC-01"
    - "PDC-02"
    - "PDC-03"
    - "PDC-04"
    - "PDC-05"
    - "PDC-06"
    - "ARC-YYYYMMDD-VNN"
    - "PS-YYYYMMDD-VNN"
    - "PS-01"
    - "PS-02"
    - "PS-03"
    - "PS-04"
    - "PS-05"
    - "INV-YYYYMMDD-VNN"
    - "AGC-YYYYMMDD-VNN"
    - "AGC-01"
    - "AGC-02"
    - "AGC-03"
    - "AGC-04"
    - "AGC-05"
    - "AGC-06"
    - "ICON-YYYYMMDD-VNN"
    - "IA-01"
    - "IA-02"
    - "IA-03"
    - "IA-04"
    - "IA-05"
    - "IA-06"
    - "IA-07"
    - "分布"
    - "递归"
    - "G-01"
    - "G-02"
    - "G-03"
    - "G-04"
    - "G-05"
    - "G-06"
    - "所有页面"
    - "小程序外框"
    - "可见边界"
  must_not_contain:
    - "节点创建成功即可验收"
