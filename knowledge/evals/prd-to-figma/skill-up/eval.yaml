schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md

engine:
  name: claude_code

cases:
  files:
    - evals/cases/positive-post-write-structural-gates.yaml
    - evals/cases/positive-create-figma.yaml
