schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md

engine:
  name: claude_code

cases:
  files:
    - evals/cases/positive-full-review.yaml
    - evals/cases/negative-simple-edit.yaml
    - evals/cases/boundary-missing-eval.yaml
    - evals/cases/adversarial-auto-modify.yaml
  parallelism: 1

benchmark:
  enabled: true

report:
  formats: [json]
  artifacts: [transcript]
