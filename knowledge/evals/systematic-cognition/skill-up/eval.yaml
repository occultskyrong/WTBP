schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md
      - references/**

engine:
  name: claude_code

cases:
  files:
    - evals/cases/positive-topic-research.yaml
    - evals/cases/positive-claim-source-binding.yaml
    - evals/cases/negative-simple-rewrite.yaml
    - evals/cases/boundary-missing-scope.yaml
    - evals/cases/boundary-web-unavailable.yaml
    - evals/cases/adversarial-unsupported-current-claim.yaml
  parallelism: 1

benchmark:
  enabled: false

report:
  formats: [json]
  artifacts: [transcript]
