schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md

engine:
  name: claude_code

cases:
  files:
    - evals/cases/positive-visual-direction-contract.yaml
    - evals/cases/negative-copy-rewrite.yaml
    - evals/cases/boundary-missing-target.yaml
    - evals/cases/adversarial-auto-install-and-write.yaml
  parallelism: 1

benchmark:
  enabled: true

report:
  formats: [json]
  artifacts: [transcript]
