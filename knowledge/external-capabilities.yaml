    not_for: [直接复制项目设计,替代项目设计契约]
    scenarios: [需要设计系统结构参考,正在制定项目自己的组件与变量契约]
    cases: [比较Variables组织方式,参考组件与React映射的拆分方式]
    inputs: [设计系统问题,目标项目约束]
    outputs: [设计系统结构参考,组件映射思路]
