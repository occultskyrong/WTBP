version: 1
description: 外部最佳实践卡清单。它记录可发现、可追溯的外部能力、适用场景和典型 Case；不替代本地 Skill 的能力索引、路由、Eval 或安装授权。
capabilities:
  - id: figma-official-mcp
    title: Figma 官方 MCP 能力
    summary: 在当前客户端已提供且获授权时，读取或写入 Figma 设计产物、组件和变量。
    source_id: source.figma-mcp-server-guide
    kind: official-integration
    domains: [product, design, engineering]
    capabilities: [figma-create, figma-evolve, figma-inspection, figma-to-code]
    stages: [design, evolve, implement, verify]
    solves: [Figma设计稿读写,组件变量读取,设计节点检查]
    not_for: [替代项目视觉验收,自动安装第三方Skill]
    scenarios: [已获授权的Figma设计协作,需要读取或写入真实设计节点]
    cases: [读取指定页面的组件变量,在已授权文件中写入设计节点]
    inputs: [已授权Figma文件,明确设计目标]
    outputs: [Figma节点,组件变量,设计检查结果]
    technologies: [Figma,MCP]
    targets: [Figma设计稿,设计系统]
    adoption: local-adapter
    availability: client-provided
    installation_status: client-provided
    permissions: 受当前客户端 Figma OAuth、文件访问权限和目标项目授权约束。
    verify: 由当前会话确认 Figma 工具可用、目标文件可访问；不可用时记录为 Unverified。
    status: active
    keywords: [Figma, 设计稿, 组件, 变量, 节点, MCP]
  - id: figma-code-connect
    title: Figma Code Connect
    summary: 将 Figma 组件、属性和设计系统映射到消费项目的真实代码组件。
    source_id: source.figma-code-connect
    kind: official-integration
    domains: [design, engineering]
    capabilities: [figma-to-code, figma-inspection]
    stages: [design, implement, verify]
    solves: [Figma组件映射,设计系统代码连接,组件属性同步]
    not_for: [自动生成完整产品,替代代码运行验收]
    scenarios: [已有Figma组件且需映射真实代码组件,需要核验设计变体与组件属性]
    cases: [为按钮组件建立Code Connect映射,核验Figma变体与React属性一致]
    inputs: [Figma组件,目标代码组件,项目配置]
    outputs: [组件映射,属性映射,代码连接证据]
    technologies: [Figma,Code Connect,React]
    targets: [设计系统,前端代码]
    adoption: local-adapter
    availability: client-provided
    installation_status: client-provided
    permissions: 受 Figma 计划、消费项目仓库权限和项目配置约束；不得由 WTBP 代管。
    verify: 核对目标组件、属性和代码映射；无法访问时标记为 Unverified，不得虚构映射。
    status: active
    keywords: [Code Connect, 组件映射, 设计系统, Figma, 代码组件]
