version: 1
description: 本地 Skill 能力规范索引。它是本地 Skill 标签、输入输出、影响范围与路由关联的唯一来源；外部能力另见 external-capabilities.yaml，catalog 仅负责对象发现，routes 仅负责任务匹配与受控安装。
taxonomy:
  domains: [research, product, governance, design, engineering, quality]
  capabilities: [practice-search, option-comparison, evidence-synthesis, web-research, source-verification, skill-evaluation, regression-evaluation, task-routing, managed-install, api-testing, contract-testing, integration-testing, figma-create, figma-evolve, figma-inspection, figma-to-code, visual-verification, layout-diagnosis, visual-direction, icon-design, motion-design]
  stages: [discover, analyze, design, evolve, implement, verify, evaluate]
  side_effects: [none, filesystem-read, filesystem-write, network-read, network-write, figma-read, figma-write, command-execution]
skills:
  - id: practice-search
    title: 场景化最佳实践检索
    summary: 基于场景、约束、证据和参考实现比较技术或产品方案。
    domains: [research, product]
    capabilities: [practice-search, option-comparison, evidence-synthesis]
    stages: [discover, analyze]
    inputs: [问题, 场景约束, 所需证据]
    outputs: [候选方案, 推荐建议, 证据边界, 验证方法]
    side_effects: [filesystem-read]
    status: active
    install: builtin
    aliases: []
    route_ids: [route.practice-search]
  - id: systematic-cognition
    title: 证据优先的系统化认知
    summary: 检索公开资料，区分事实、推论和未验证项，并给出可追溯来源。
    domains: [research, product]
    capabilities: [web-research, source-verification, evidence-synthesis]
    stages: [discover, analyze]
    inputs: [研究主题, 范围, 时间要求]
    outputs: [核心认知, 证据表, 不确定性, 下一步问题]
    side_effects: [network-read]
    status: active
    install: builtin
    aliases: []
    route_ids: [route.systematic-cognition]
  - id: skill-evaluation
    title: Skill 结构与行为评测
    summary: 审查 Skill 的触发边界、结构、安全、行为表现和质量门禁。
    domains: [governance, quality]
    capabilities: [skill-evaluation, regression-evaluation]
    stages: [evaluate]
    inputs: [目标 Skill, 版本或提交, Eval 范围]
    outputs: [评测结论, 门禁结果, 风险与未验证项]
    side_effects: [filesystem-read, command-execution]
    status: active
    install: builtin
    aliases: [ske]
    route_ids: [route.skill-evaluation]
  - id: skill-router
    title: 多 Skill 能力发现与路由
    summary: 浏览能力地图、查看 Skill 卡片，并将自然语言任务路由到最小适用的 Skill。
    domains: [governance]
    capabilities: [task-routing, managed-install]
    stages: [discover]
    inputs: [任务描述, 目标领域, 安装需求]
    outputs: [能力列表, Skill 卡片, 路由建议, 安装边界]
    side_effects: [filesystem-read, network-read, filesystem-write]
    status: active
    install: builtin
    aliases: [wtbp]
    route_ids: [route.skill-router]
  - id: external-capability-discovery
    title: 外部能力在线发现与排名
    summary: 在本地能力无明确适配项时，检索公开 Skill、GitHub 方案与官方集成，并按可追溯百分制评分排序。
    domains: [research, governance, product]
    capabilities: [web-research, source-verification, evidence-synthesis, task-routing]
    stages: [discover, analyze, evaluate]
    inputs: [任务目标, 技术或终端约束, 采用边界]
    outputs: [候选能力卡, 百分制排名, 证据置信度, 采用建议]
    side_effects: [network-read, filesystem-read]
    status: candidate
    install: builtin
    aliases: []
    route_ids: [route.external-capability-discovery]
  - id: external-capability-curation
    title: 外部能力收录与可检索记忆
    summary: 将用户提供的公开项目或 Skill 自动转为可发现、未安装且含场景与 Case 的外部最佳实践卡。
    domains: [research, governance]
    capabilities: [source-verification, evidence-synthesis, task-routing]
    stages: [discover, analyze, evaluate]
    inputs: [公开来源URL, 收集授权, 可选使用场景]
    outputs: [来源记录, 未安装最佳实践卡, 场景与Case, 命中信号, 去重结论]
    side_effects: [network-read, filesystem-read, filesystem-write]
    status: candidate
    install: builtin
    aliases: []
    route_ids: [route.external-capability-curation]
  - id: visual-direction
    title: 证据驱动的视觉方向定义
    summary: 在页面样式前形成可观察、可评审、可替换外部依赖的视觉方向契约。
    domains: [product, design, research]
    capabilities: [visual-direction, evidence-synthesis, source-verification]
    stages: [analyze, design, evaluate]
    inputs: [产品目标, 目标终端, 项目设计基础, 视觉参考, 可访问性约束]
    outputs: [VIS视觉方向, Token角色, 参考证据, 反例, 下游映射]
    side_effects: [filesystem-read, network-read]
    status: active
    install: builtin
    aliases: [visual-design-direction]
    route_ids: [route.visual-direction]
  - id: icon-design
    title: 可治理的 Icon 资产设计
    summary: 基于批准范围和 Icon 门禁，创作、验证并交接可复用的 Icon 资产家族。
    domains: [product, design, quality]
    capabilities: [icon-design, visual-direction, visual-verification]
    stages: [design, verify, evaluate]
    inputs: [INV或ICON范围, AGC动作组, Icon来源, 目标尺寸, 家族风格, 导出目标]
    outputs: [ICON资产清单, Icon组件或导出物, IA门禁结果, 实现映射]
    side_effects: [filesystem-read, filesystem-write, network-read]
    status: active
    install: builtin
    aliases: [icon-asset-design]
    route_ids: [route.icon-design]
  - id: motion-design
    title: 有目的且可验证的产品动效设计
    summary: 定义动效目的、状态转移、时序、缓动、减弱动效和动态验收，同时把外部动效能力保持为可替换适配器。
    domains: [product, design, quality]
    capabilities: [motion-design, visual-verification]
    stages: [design, implement, verify, evaluate]
    inputs: [PS页面规格, AGC动作组, 状态转移, 目标终端, 可访问性约束, 性能约束]
    outputs: [MOTION动效契约, 转移矩阵, 实现映射, 动态证据, 人工评审]
    side_effects: [filesystem-read, filesystem-write, network-read]
    status: active
    install: builtin
    aliases: [product-motion-design]
    route_ids: [route.motion-design]
  - id: api-testing
    title: 接口四层测试体系
    summary: 设计和验证可用性探针、真实主流程、Mock 逻辑契约和隔离业务链，分开记录运行时证据与静态测试证据。
    domains: [engineering, quality]
    capabilities: [api-testing, contract-testing, integration-testing]
    stages: [design, implement, verify, evaluate]
    inputs: [服务与接口范围, 测试环境, 认证边界, 接口契约, 标准参数, 测试数据与清理策略]
    outputs: [四层测试矩阵, 接口契约基线, 执行证据, 失败分类, CI门禁, 未验证项]
    side_effects: [filesystem-read, filesystem-write, command-execution, network-read]
    status: candidate
    install: builtin
    aliases: [api-test, interface-testing, 接口测试]
    route_ids: [route.api-testing]
  - id: prd-to-figma
    title: PRD 到可编辑 Figma 设计
    summary: 从 PRD 创建首版可编辑 Figma 设计、页面、状态、组件和基础设计资产。
    domains: [product, design]
    capabilities: [figma-create, figma-inspection]
    stages: [design]
    inputs: [PRD, Figma 目标, 目标终端]
    outputs: [Figma 文件或节点, 设计契约, 页面和状态链接]
    side_effects: [figma-read, figma-write]
    status: candidate
    install: builtin
    aliases: []
    route_ids: [route.prd-to-figma]
  - id: figma-evolve
    title: Figma 范围化演进
    summary: 在保留历史设计证据的前提下，对已有 Figma 节点进行补丁或版本化重做。
    domains: [product, design]
    capabilities: [figma-evolve, figma-inspection]
    stages: [evolve]
    inputs: [Figma 节点, 变更请求, PRD 增量]
    outputs: [变更节点, 版本链接, 下游影响]
    side_effects: [figma-read, figma-write]
    status: candidate
    install: builtin
    aliases: []
    route_ids: [route.figma-evolve]
  - id: figma-to-product
    title: Figma 到指定产品终端实现
    summary: 将明确 Figma 节点以可维护布局还原到唯一指定的 Web、小程序或 App 终端。
    domains: [product, design, engineering]
    capabilities: [figma-to-code, figma-inspection, layout-diagnosis]
    stages: [implement]
    inputs: [Figma 节点, 目标终端, 目标仓库]
    outputs: [实现文件, 布局归因, 运行证据]
    side_effects: [figma-read, filesystem-read, filesystem-write]
    status: candidate
    install: builtin
    aliases: []
    route_ids: [route.figma-to-product]
  - id: figma-verify
    title: Figma 与产品实现验收
    summary: 对指定终端、视口和状态验证 Figma 与运行实现的差异，并定位首个布局责任层。
    domains: [product, design, quality]
    capabilities: [visual-verification, layout-diagnosis, figma-inspection]
    stages: [verify]
    inputs: [Figma 节点, 运行实现, 验收矩阵]
    outputs: [通过矩阵, 差异归因, 修复证据或风险]
    side_effects: [figma-read, filesystem-read, filesystem-write]
    status: candidate
    install: builtin
    aliases: []
    route_ids: [route.figma-verify]
