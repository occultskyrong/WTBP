version: 1
description: 从问题场景路由到已有 Skill；只有没有合适路由且流程稳定时才新建 Skill。
routes:
  - id: route.practice-search
    title: 高影响决策的最佳实践检索
    skill_id: practice-search
    source: local
    path: skills/practice-search
    install: none
    status: active
    last_verified: 2026-08-11
    keywords: [比较, 方案, 架构, 技术, 成本, 安全, 合规, 可逆性, practice, architecture, compare]
    triggers:
      - 需要比较架构、技术、成本、安全或可逆性方案
      - 需要复用 WTBP Practice、证据或参考实现
      - 缺少内部先例，需要先检索场景化最佳实践
    not_for:
      - 简单翻译、改写或不涉及方案取舍的文字处理
      - 已有明确项目事实且不需要比较外部方案的机械执行

  - id: route.systematic-cognition
    title: 公开主题的证据优先认知
    skill_id: systematic-cognition
    source: local
    path: skills/systematic-cognition
    install: none
    status: active
    last_verified: 2026-08-16
    keywords: [全网, 搜索, 当前, 来源, 认知, 事实, 推论, research, search, source]
    triggers:
      - 用户要求全网搜索、当前信息、准确来源或系统化了解主题
      - 需要区分已确认事实、推论和未验证项
      - 主题涉及易变的产品、政策、价格、人物或安全信息
    not_for:
      - 简单翻译、摘要改写或无需外部证据的编辑任务
      - 访问私有数据、绕过登录或执行未声明的外部副作用

  - id: route.skill-evaluation
    title: 已有 Skill 的结构与行为评测
    skill_id: skill-evaluation
    source: local
    path: skills/skill-evaluation
    install: none
    alias: ske
    status: active
    last_verified: 2026-08-11
    keywords: [评估, 评测, 验收, 回归, 门禁, skill, eval, evaluate, evaluation]
    triggers:
      - 需要审查、验收、回归或比较一个已有 Skill
      - 新增或修改 Skill，需要确认 Eval、触发边界和安全边界
      - 需要判断行为评测是否达到门禁值
    not_for:
      - 只修改普通文档或不涉及 Skill 行为的简单任务
      - 未提供目标 Skill、版本或评测范围的完整质量结论

  - id: route.skill-router
    title: 多 Skill 的统一发现与渐进路由
    skill_id: skill-router
    source: local
    path: skills/skill-router
    install: none
    status: active
    last_verified: 2026-08-13
    keywords: [skill, 技能, 路由, 选择, 安装, 复用, router, route, install]
    triggers:
      - 用户询问应使用哪个 Skill，或希望通过一个入口处理多个 Skill
      - 任务可能命中多个 Skill，需要先比较边界和加载路径
      - 需要查询已有 Skill、外部 Skill 的安装信息或复用方式
    not_for:
      - 已有单一明确 Skill 且用户要求直接执行的任务
      - 不涉及 Skill 的普通翻译、改写或一次性编辑

  - id: route.external-capability-discovery
    title: 本地无明确适配项时的外部能力在线发现
    skill_id: external-capability-discovery
    source: local
    path: skills/external-capability-discovery
    install: none
    status: candidate
    last_verified: 2026-08-16
    keywords: [外部, GitHub, skills.sh, 现成, 开源, 搜索技能, 找 Skill, 解决方案, reference implementation, existing skill]
    triggers:
      - 当前会话已检查本地 Skill 与已登记外部能力，但没有明确适配项
      - 用户要求在线搜索可复用的 Skill、GitHub 方案、官方集成或参考实现并进行比较
      - 用户要求候选按场景契合、维护活跃度、社区采用、许可证和安全边界进行百分制排名
    not_for:
      - 已有一个明确适配的本地 Skill，且用户只要求直接执行该流程
      - 简单改写、普通问答、未说明要解决什么问题的泛化搜索

  - id: route.external-capability-curation
    title: 收录用户提供的外部项目或 Skill
    skill_id: external-capability-curation
    source: local
    path: skills/external-capability-curation
    install: none
    status: candidate
    last_verified: 2026-08-16
    keywords: [收集, 收录, 登记, 记住, 预置, GitHub 项目, GitHub 仓库, 外部Skill, 外部能力, 收藏技能, collect capability]
    triggers:
      - 用户说出 `wtbp，收集 <公开 URL>`，或提供公开 GitHub 项目、Skill 或官方来源并要求后续可搜索或命中
      - 用户要求将外部能力保存为未安装、可复用的候选卡
      - 用户要求对已收录能力更新来源、修订、适用范围或检索信号
    not_for:
      - 仅讨论、比较或一次性搜索一个外部链接而不要求留存
      - 要求自动安装、执行第三方内容或读取凭据

  - id: route.visual-direction
    title: 页面样式前的视觉方向定义
    skill_id: visual-direction
    source: local
    path: skills/visual-direction
    install: none
    status: active
    last_verified: 2026-08-16
    keywords: [视觉方向, 审美, 好看, 人味, 风格, 参考设计, visual direction, visual design, taste]
    triggers:
      - 用户要求在 Figma 或页面设计前确定更美观、更有辨识度的视觉方向
      - 需要把参考设计转为 Token、Typography、Icon、动效人格和反例
      - 需要在页面样式前产出可评审的视觉方向契约
    not_for:
      - 已有批准视觉方向后的 Figma 写入或代码实现
      - 单纯生成海报、Logo 或一次性图片

  - id: route.icon-design
    title: Icon 资产家族设计与验证
    skill_id: icon-design
    source: local
    path: skills/icon-design
    install: none
    status: active
    last_verified: 2026-08-16
    keywords: [Icon, 图标, 图标设计, 图标系统, SVG, icon design, icon set, icon family]
    triggers:
      - 已批准范围中缺少 Icon，需要独立设计为可复用资产
      - 需要建立 Icon 家族、尺寸、状态、来源和实现映射
      - 需要验证 Icon 的小尺寸可读性、家族一致性和渲染一致性
    not_for:
      - 只选择已有项目 Icon 而不创作或验证资产
      - 未声明范围、目标尺寸或来源的随意页面装饰

  - id: route.motion-design
    title: 产品动效契约与动态验收
    skill_id: motion-design
    source: local
    path: skills/motion-design
    install: none
    status: active
    last_verified: 2026-08-16
    keywords: [动效, 动画, 交互动画, 转场, 微交互, motion, animation, transition, easing, choreography]
    triggers:
      - 需要定义产品动效人格、状态转移、时长、缓动或编排
      - 需要设计加载、成功、错误、悬停、页面转场或滚动动效
      - 需要减弱动效策略和视频/关键帧/运行时动态证据
    not_for:
      - 只需静态 Figma 页面或普通截图验收
      - 未声明触发、状态转移、目标终端或可访问性边界的装饰动画

  - id: route.prd-to-figma
    title: PRD 到可编辑 Figma 设计
    skill_id: prd-to-figma
    source: local
    path: skills/prd-to-figma
    install: none
    status: candidate
    last_verified: 2026-08-14
    keywords: [PRD, 需求文档, 从零设计, 新建设计稿, create-figma]
    triggers:
      - 用户提供 PRD 文本、文件或链接，要求创建或更新可编辑 Figma 设计
      - 用户要求新建 Figma 文件作为设计落点，或提供已有文件作为目标
    not_for:
      - 已有 Figma 节点后的局部设计修改
      - 只需从 Figma 实现单个终端，或只需视觉验收

  - id: route.figma-evolve
    title: 已有 Figma 的受范围约束演进
    skill_id: figma-evolve
    source: local
    path: skills/figma-evolve
    install: none
    status: candidate
    last_verified: 2026-08-14
    keywords: [修改, 改设计, 改版, 重做, 重设计, 重新设计, 整体重设计, 全局重设计, 整体改版, 整套设计稿, 局部修改, patch, regenerate]
    triggers:
      - 用户提供 Figma 文件或节点链接，要求修改细节、补页面/状态或替换组件
      - 用户要求在保留历史版本的条件下重做明确设计范围
    not_for:
      - 没有 Figma 设计时从 PRD 创建首次设计
      - 从 Figma 落地代码或只做运行产品验收

  - id: route.figma-to-product
    title: Figma 节点到指定产品终端
    skill_id: figma-to-product
    source: local
    path: skills/figma-to-product
    install: none
    status: candidate
    last_verified: 2026-08-14
    keywords: [落地, web, 小程序, app, 前端, CSS, 还原, 实现, to-product]
    triggers:
      - 用户提供 Figma 节点和目标代码仓库，要求实现 Web、小程序、iOS、Android 或其他一个明确终端
      - 用户需要排查 Figma 到代码实现中的布局责任层、absolute 定位或父级 CSS 偏移
    not_for:
      - 仅创建或修改 Figma 设计，不需要代码实现
      - 只需要已有运行实现与 Figma 的验收报告

  - id: route.figma-verify
    title: Figma 与指定终端的证据验收
    skill_id: figma-verify
    source: local
    path: skills/figma-verify
    install: none
    status: candidate
    last_verified: 2026-08-14
    keywords: [验收, 截图, 差异, 偏移, 视觉回归, 验证, verify]
    triggers:
      - 用户提供 Figma 节点和运行中产品，要求按指定 target、状态、viewport 或设备验收
      - 用户需要定位 Figma 与实现之间的视觉或 CSS 布局偏移
    not_for:
      - 没有运行产品时的首次 Figma 设计或代码实现
      - 不涉及 Figma 或实现对比的普通截图说明
