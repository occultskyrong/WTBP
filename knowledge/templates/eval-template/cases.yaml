version: 1
skill_id: example-skill
baseline: true
runs: 3
cases:
  - id: positive-example
    category: positive
    expect_skill: true
    prompt: "给出一个需要使用 example-skill 的真实任务。"
    assertions:
      - type: output
        value: "包含可验证的输出契约"
  - id: negative-example
    category: negative
    expect_skill: false
    prompt: "给出一个不应使用 example-skill 的任务。"
    assertions:
      - type: selection
        value: "不触发 example-skill"
  - id: boundary-example
    category: boundary
    expect_skill: true
    prompt: "给出一个缺少关键上下文的任务。"
    assertions:
      - type: output
        value: "先指出缺失变量"
